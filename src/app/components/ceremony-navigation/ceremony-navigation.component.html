<nav class="ceremony-nav" aria-label="Ceremony navigation">
  <div class="nav-shell ornate-surface">
    <ul class="nav-list">
      @for (item of items; track item.id) {
        <li>
          <button type="button" class="nav-chip" (click)="navigate.emit(item.id)">
            {{ item.shortLabel }}
          </button>
        </li>
      }
    </ul>

    <div class="countdown-strip" aria-label="Wedding day countdown">
      <div class="countdown-copy">
        <p class="countdown-kicker">Wedding Day Countdown</p>
      </div>

      @if (countdown().completed) {
        <p class="countdown-live">The celebration day has arrived.</p>
      } @else {
        <div class="countdown-grid">
          @for (part of countdownParts(); track part.label) {
            <div class="countdown-unit">
              <strong>{{ part.value }}</strong>
              <span>{{ part.label }}</span>
            </div>
          }
        </div>
      }
    </div>
  </div>
</nav>
